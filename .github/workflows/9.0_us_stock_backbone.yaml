name: 9.0_Fetch_US_Stock_Backbone_list_srs_yaml
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.9'}
      - run: pip install requests
      - name: 执行生成逻辑
        run: |
          python us_stock_backbone/scripts/fetch_domains.py
          python us_stock_backbone/scripts/generate.py
      - name: 提交并推送成果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --quiet --cached; then
            git commit -m "auto: update rules & readme"
            git push
          else
            echo "[-] 无变化，跳过推送"
          fi
