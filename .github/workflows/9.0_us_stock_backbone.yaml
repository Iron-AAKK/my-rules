name: 9.0_Fetch_US_Stock_Backbone_list_srs_yaml
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.9'}
      - run: pip install requests
      - run: python us_stock_backbone/scripts/fetch_domains.py
      - run: python us_stock_backbone/scripts/generate.py
      - run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Rules" && git push)
